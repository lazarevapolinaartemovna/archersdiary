"ad-btn">Сохранить тренировку</button><button type="button" class="ad-btn ghost">Отмена</button><span class="ad-tag">Лучшая серия</span></div><p class="ad-hint">Так будут выглядеть элементы дневника с текущими настройками.</p></section></main><script>
(function () {
  var app = document.getElementById("archer-app");
  if (!app) return;
  var t = {};
  try { t = JSON.parse(localStorage.getItem("ad_theme") || "{}"); } catch (e) {}
  if (t.mode === "dark") app.classList.add("dark");
  if (t.accent) app.classList.add("acc-" + t.accent);
  window.ADAPI = {
    user: function () { try { return JSON.parse(localStorage.getItem("ad_user") || "null"); } catch (e) { return null; } },
    setUser: function (u) { localStorage.setItem("ad_user", JSON.stringify(u)); },
    users: function () { try { return JSON.parse(localStorage.getItem("ad_users") || "[]"); } catch (e) { return []; } },
    saveUsers: function (a) { localStorage.setItem("ad_users", JSON.stringify(a)); },
    entries: function () {
      var u = this.user(); if (!u) return [];
      try { return JSON.parse(localStorage.getItem("ad_entries_" + u.email) || "[]"); } catch (e) { return []; }
    },
    saveEntries: function (a) {
      var u = this.user(); if (!u) return;
      localStorage.setItem("ad_entries_" + u.email, JSON.stringify(a));
    },
    logout: function () { localStorage.removeItem("ad_user"); location.href = "index.html"; }
  };
  var u = window.ADAPI.user();
  var ub = document.getElementById("userEmail");
  if (ub && u) ub.textContent = u.name ? u.name + " · " + u.email : u.email;
  var out = document.getElementById("logoutBtn");
  if (out) out.addEventListener("click", window.ADAPI.logout);
})();
</script><script>
if (!localStorage.getItem("ad_user")) location.replace("index.html");
</script><script>
(function () {
  var app = document.getElementById("archer-app");
  var ACCENTS = ["blue", "wine", "amber", "plum"];

  function applyTheme(mode, accent, save) {
    app.classList.toggle("dark", mode === "dark");
    ACCENTS.forEach(function (a) { app.classList.remove("acc-" + a); });
    if (accent && accent !== "green") app.classList.add("acc-" + accent);

    document.getElementById("themeLight").classList.toggle("cur", mode !== "dark");
    document.getElementById("themeDark").classList.toggle("cur", mode === "dark");
    Array.prototype.forEach.call(document.querySelectorAll(".ad-swatch"), function (sw) {
      var acc = sw.getAttribute("data-acc") || "green";
      sw.classList.toggle("cur", acc === accent || (acc === "green" && !accent));
    });
    if (save) {
      localStorage.setItem("ad_theme", JSON.stringify({ mode: mode, accent: accent || "" }));
      var ok = document.getElementById("themeOk");
      ok.textContent = "Настройки сохранены и применяются на всех страницах дневника.";
      ok.classList.add("show");
      setTimeout(function () { ok.classList.remove("show"); }, 2200);
    }
  }

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem("ad_theme") || "{}"); } catch (e) {}
  var mode = saved.mode === "dark" ? "dark" : "light";
  var accent = saved.accent || "green";

  document.getElementById("themeLight").addEventListener("click", function () {
    mode = "light";
    applyTheme(mode, accent, true);
  });
  document.getElementById("themeDark").addEventListener("click", function () {
    mode = "dark";
    applyTheme(mode, accent, true);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".ad-swatch"), function (sw) {
    sw.addEventListener("click", function () {
      accent = sw.getAttribute("data-acc") || "green";
      applyTheme(mode, accent, true);
    });
  });

  applyTheme(mode, accent, false);
})();
</script></div>
